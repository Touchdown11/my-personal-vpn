group 'orban.group.wireguard_flutter'
version '1.0-SNAPSHOT'

// Patched for Flutter 3.38.x / AGP 8.11.x / Kotlin 2.2.x.
// The upstream 1.0.9 build script pinned AGP 7.1.3, Kotlin 1.8.10, and
// compileSdk 31, which is incompatible with the generated Flutter app and
// AndroidX dependencies used by this project.
apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'orban.group.wireguard_flutter'
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdk 24
    }
}

dependencies {
    implementation 'com.wireguard.android:tunnel:1.0.20260102'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'com.beust:klaxon:5.5'
    implementation 'androidx.appcompat:appcompat:1.7.1'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}

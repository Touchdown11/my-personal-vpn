on:
  push:
    branches: [ main, master, 'arena/**' ]
  workflow_dispatch: # Lets you click "Run workflow" manually anytime on GitHub!

jobs:
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.38.10'

      - name: Verify vendored Android plugin sources
        run: test -f third_party/wireguard_flutter_plus/android/src/main/kotlin/orban/group/wireguard_flutter/WireguardFlutterPlugin.kt

      - name: Generate Android platform scaffolding & preserve app code
        run: |
          cp /tmp/pubspec.yaml.bak pubspec.yaml
          rm -rf lib && cp -r /tmp/lib.bak lib

      - name: Prepare Android desugaring and INTERNET permission
        run: dart tool/prepare_android.dart

      - name: Install Dart & Flutter dependencies
        run: flutter pub get
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.38.10'

      - name: Verify vendored Windows plugin sources
        shell: pwsh
        run: |
          if (-not (Test-Path 'third_party/wireguard_flutter_plus/windows/CMakeLists.txt')) {
            throw 'Vendored Windows plugin sources are missing from the checkout.'
          }

      - name: Generate Windows platform scaffolding & preserve app code
        shell: pwsh